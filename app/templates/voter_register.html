<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Voter Registration - Biometric Voting System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="nav-container">

            <div class="logo">
                📋 Biometric Voting System
            </div>

            <nav>

                <a href="{{ url_for('home') }}">
                    Home
                </a>

                <a href="{{ url_for('voter_login') }}">
                    Voter Login
                </a>

            </nav>

        </div>

    </header>


    <!-- Registration -->

    <main class="login-page">

        <div class="login-card">

            <div class="login-icon">
                📝
            </div>

            <h1>
                Voter Registration
            </h1>

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    <div class="login-error">
                        {{ messages[0] }}
                    </div>

                {% endif %}

            {% endwith %}


            <p class="login-subtitle">
                Register yourself to use the biometric voting system.
            </p>


            <form method="POST"
                  action="{{ url_for('voter_register') }}">


                <!-- Voter Number -->

                <div class="form-group">

                    <label for="voter_number">
                        Voter Number *
                    </label>

                    <input
                        type="text"
                        id="voter_number"
                        name="voter_number"
                        placeholder="Enter voter number"
                        required
                    >

                </div>


                <!-- Full Name -->

                <div class="form-group">

                    <label for="full_name">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter full name"
                        required
                    >

                </div>


                <!-- Date of Birth -->

                <div class="form-group">

                    <label for="date_of_birth">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="date_of_birth"
                        name="date_of_birth"
                    >

                </div>


                <!-- Gender -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender">

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Mobile -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter mobile number"
                    >

                </div>


                <!-- Address -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your address"
                    ></textarea>

                </div>


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Voter Login ID *
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Create your login ID"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password *
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create your password"
                        required
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="login-button">

                    📝 Register & Continue

                </button>

            </form>


            <div class="login-info">

                <span>🔒</span>

                <p>
                    Your information is securely protected.
                </p>

            </div>


            <a href="{{ url_for('home') }}"
               class="back-link">

                ← Back to Home

            </a>

        </div>

    </main>

</body>

</html>
