<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Voter Login - Biometric Voting System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>
    <!-- Header -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">📋 Biometric Voting System</div>

            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Login Section -->
    <main class="login-page">
        <div class="login-card">
            <div class="login-icon">👤</div>

            <h1>Voter Login</h1>

            {% with messages = get_flashed_messages() %} {% if messages %}
            <div class="login-error">{{ messages[0] }}</div>
            {% endif %} {% endwith %}

            <p class="login-subtitle">Enter your voter details to continue</p>

            <form method="POST" action="{{ url_for('voter_login') }}">
                <div class="form-group">
                    <label for="voter_id"> Voter ID </label>

                    <input type="text" id="voter_id" name="voter_id" placeholder="Enter your Voter ID" required />
                </div>

                <div class="form-group">
                    <label for="password"> Password </label>

                    <input type="password" id="password" name="password" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="login-button">Continue</button>
            </form>

            <div class="login-info">
                <span>🔒</span>

                <p>Your information is securely protected.</p>
            </div>

            <div class="register-prompt">
                <p>New voter?</p>

                <a href="{{ url_for('voter_register') }}" class="register-link">
                    Register here
                </a>
            </div>

            <a href="{{ url_for('home') }}" class="back-link"> ← Back to Home </a>
        </div>
    </main>
</body>

</html>
